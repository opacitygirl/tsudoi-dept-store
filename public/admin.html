<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百貨店の管理｜つどい百貨店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">つどい百貨店</a>
  <nav><a href="index.html#shops">フロアガイド</a></nav>
</header>

<main>
  <h2 class="section-title">百貨店の管理</h2>
  <div class="form-card" style="margin-bottom:24px">
    <label>管理キー</label>
    <input id="admin-key" type="password" placeholder="管理キーを入力">
    <div class="cta-row"><button class="btn sub" id="load-btn">申込・注文・店舗を読み込む</button></div>
    <p class="msg" id="admin-msg"></p>
  </div>

  <h3>出店申込</h3>
  <div id="apps"></div>

  <h3 style="margin-top:32px">注文一覧</h3>
  <div id="orders"></div>

  <h3 style="margin-top:32px">店舗一覧・テナント編集キー</h3>
  <p style="font-size:13px;line-height:1.9">各お店の店主が自分で商品を編集するためのキーです。新しく承認したお店には、承認メールでキーが自動送信されます。既存のお店は、ここから発行して店主へ直接お伝えください。再発行すると古いキーは使えなくなります。</p>
  <div id="shops"></div>

  <h3 style="margin-top:32px">店舗への商品追加</h3>
  <form class="form-card" id="product-form">
    <label>お店</label>
    <select id="shop-select"></select>
    <label>商品名</label>
    <input id="p-name" required maxlength="60">
    <label>価格（円）</label>
    <input id="p-price" type="number" required min="100" max="1000000" step="10">
    <label>説明</label>
    <textarea id="p-desc" rows="2" maxlength="200"></textarea>
    <label>商品写真（任意）</label>
    <div id="p-photo"></div>
    <div class="cta-row"><button class="btn" type="submit">商品を追加</button></div>
    <p class="msg" id="product-msg"></p>
  </form>
</main>

<footer>つどい百貨店（プロトタイプ）</footer>

<script src="image-upload.js"></script>
<script>
const adminPhoto = createPhotoField("");
document.getElementById("p-photo").appendChild(adminPhoto.element);
function key() { return document.getElementById("admin-key").value; }
function headers() { return { "Content-Type": "application/json", "x-admin-key": key() }; }

function loadAll() {
  const msg = document.getElementById("admin-msg");
  fetch("/api/admin/applications", { headers: headers() })
    .then(r => { if (!r.ok) throw new Error("auth"); return r.json(); })
    .then(apps => {
      msg.className = "msg ok";
      msg.textContent = "読み込みました。";
      const box = document.getElementById("apps");
      box.innerHTML = "";
      if (apps.length === 0) box.innerHTML = "<p>申込はまだありません。</p>";
      apps.slice().reverse().forEach(function (a) {
        const div = document.createElement("div");
        div.className = "app-card";
        div.innerHTML =
          '<span class="status ' + a.status + '">' + a.status + "</span> " +
          "<strong>" + a.shopName + "</strong>（" + a.ownerName + " / " + a.email + "）<br>" +
          a.floor + " ｜ " + a.genre + " ｜ " + a.tagline + "<br>" +
          "最初の商品：" + a.product.name + " ¥" + Number(a.product.price).toLocaleString("ja-JP");
        if (a.status === "pending") {
          const ok = document.createElement("button");
          ok.className = "small-btn"; ok.textContent = "承認してお店を開く";
          ok.addEventListener("click", function () {
            fetch("/api/admin/applications/" + a.id + "/approve", { method: "POST", headers: headers() })
              .then(r => r.json())
              .then(d => { if (d.ok) { alert("お店ができました: /shop.html?slug=" + d.slug); loadAll(); } else alert(d.error); });
          });
          const ng = document.createElement("button");
          ng.className = "small-btn"; ng.textContent = "見送る";
          ng.addEventListener("click", function () {
            fetch("/api/admin/applications/" + a.id + "/reject", { method: "POST", headers: headers() })
              .then(() => loadAll());
          });
          div.appendChild(document.createElement("br"));
          div.appendChild(ok); div.appendChild(ng);
        }
        box.appendChild(div);
      });
    })
    .catch(() => { msg.className = "msg error"; msg.textContent = "管理キーが違うか、読み込みに失敗しました。"; });

  fetch("/api/admin/orders", { headers: headers() })
    .then(r => { if (!r.ok) throw new Error("auth"); return r.json(); })
    .then(orders => {
      const box = document.getElementById("orders");
      box.innerHTML = "";
      if (orders.length === 0) box.innerHTML = "<p>注文はまだありません。</p>";
      orders.slice().reverse().forEach(function (o) {
        const div = document.createElement("div");
        div.className = "app-card";
        const items = (o.items && o.items.length)
          ? o.items.map(i => i.name + " × " + i.qty).join("、")
          : (o.summary || "");
        div.innerHTML =
          "<strong>" + o.shopName + "</strong> ｜ " + new Date(o.createdAt).toLocaleString("ja-JP") + "<br>" +
          "商品：" + items + "<br>" +
          "合計：¥" + Number(o.total).toLocaleString("ja-JP") + "<br>" +
          "購入者：" + (o.buyerName || "") + "（" + (o.email || "") + (o.phone ? " / " + o.phone : "") + "）<br>" +
          "配送先：" + (o.address || "（未取得）");
        box.appendChild(div);
      });
    })
    .catch(() => {});

  fetch("/api/shops")
    .then(r => r.json())
    .then(shops => {
      const sel = document.getElementById("shop-select");
      sel.innerHTML = "";
      shops.forEach(function (s) {
        const o = document.createElement("option");
        o.value = s.slug; o.textContent = s.name;
        sel.appendChild(o);
      });
    });

  fetch("/api/admin/shops", { headers: headers() })
    .then(r => { if (!r.ok) throw new Error("auth"); return r.json(); })
    .then(shops => {
      const box = document.getElementById("shops");
      box.innerHTML = "";
      if (shops.length === 0) box.innerHTML = "<p>店舗はまだありません。</p>";
      shops.forEach(function (s) {
        const div = document.createElement("div");
        div.className = "app-card";
        const head = document.createElement("div");
        head.innerHTML = "<strong></strong>（" + s.floor + " ｜ " + s.genre + " ｜ 商品" + s.productCount + "点）<br>" +
          "編集キー：" + (s.hasEditKey ? "発行済み" : "未発行") +
          " ｜ <a href='/shop.html?slug=" + s.slug + "' target='_blank'>お店ページ</a>" +
          " ｜ <a href='/tenant.html?slug=" + s.slug + "' target='_blank'>編集ページ</a>";
        head.querySelector("strong").textContent = s.name;
        div.appendChild(head);
        const result = document.createElement("p");
        result.className = "msg";
        result.style.wordBreak = "break-all";
        const btn = document.createElement("button");
        btn.className = "small-btn";
        btn.textContent = s.hasEditKey ? "編集キーを再発行" : "編集キーを発行";
        btn.addEventListener("click", function () {
          if (s.hasEditKey && !confirm("再発行すると、今の編集キーは使えなくなります。よろしいですか？")) return;
          fetch("/api/admin/shops/" + s.slug + "/tenant-key", { method: "POST", headers: headers() })
            .then(r => r.json())
            .then(d => {
              if (d.ok) {
                result.className = "msg ok";
                result.textContent = "新しい編集キー: " + d.editKey + " ／ 編集ページ: " + d.tenantUrl + " ／ このキーを店主へ直接お伝えください（この表示は再読み込みすると消えます。キーを控えてから読み込んでください）";
                btn.textContent = "編集キーを再発行";
              } else {
                result.className = "msg error";
                result.textContent = d.error || "発行できませんでした";
              }
            })
            .catch(() => { result.className = "msg error"; result.textContent = "接続できませんでした。"; });
        });
        div.appendChild(btn);
        div.appendChild(result);
        box.appendChild(div);
      });
    })
    .catch(() => {});
}

document.getElementById("load-btn").addEventListener("click", loadAll);

document.getElementById("product-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const slug = document.getElementById("shop-select").value;
  const msg = document.getElementById("product-msg");
  fetch("/api/admin/shops/" + slug + "/products", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({
      name: document.getElementById("p-name").value,
      price: Number(document.getElementById("p-price").value),
      description: document.getElementById("p-desc").value,
      image: adminPhoto.getValue()
    })
  })
    .then(r => r.json())
    .then(d => {
      msg.className = d.ok ? "msg ok" : "msg error";
      msg.textContent = d.ok ? "商品を追加しました。" : (d.error || "失敗しました");
      if (d.ok) { this.reset(); adminPhoto.reset(); }
    })
    .catch(() => { msg.className = "msg error"; msg.textContent = "接続できませんでした。"; });
});
</script>
</body>
</html>
