<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百貨店の管理｜つどい百貨店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">つどい百貨店</a>
  <nav><a href="index.html#shops">フロアガイド</a></nav>
</header>

<main>
  <h2 class="section-title">百貨店の管理</h2>
  <div class="form-card" style="margin-bottom:24px">
    <label>管理キー</label>
    <input id="admin-key" type="password" placeholder="管理キーを入力">
    <div class="cta-row"><button class="btn sub" id="load-btn">申込と店舗を読み込む</button></div>
    <p class="msg" id="admin-msg"></p>
  </div>

  <h3>出店申込</h3>
  <div id="apps"></div>

  <h3 style="margin-top:32px">店舗への商品追加</h3>
  <form class="form-card" id="product-form">
    <label>お店</label>
    <select id="shop-select"></select>
    <label>商品名</label>
    <input id="p-name" required maxlength="60">
    <label>価格（円）</label>
    <input id="p-price" type="number" required min="100" max="1000000" step="10">
    <label>説明</label>
    <textarea id="p-desc" rows="2" maxlength="200"></textarea>
    <div class="cta-row"><button class="btn" type="submit">商品を追加</button></div>
    <p class="msg" id="product-msg"></p>
  </form>
</main>

<footer>つどい百貨店（プロトタイプ）</footer>

<script>
function key() { return document.getElementById("admin-key").value; }
function headers() { return { "Content-Type": "application/json", "x-admin-key": key() }; }

function loadAll() {
  const msg = document.getElementById("admin-msg");
  fetch("/api/admin/applications", { headers: headers() })
    .then(r => { if (!r.ok) throw new Error("auth"); return r.json(); })
    .then(apps => {
      msg.className = "msg ok";
      msg.textContent = "読み込みました。";
      const box = document.getElementById("apps");
      box.innerHTML = "";
      if (apps.length === 0) box.innerHTML = "<p>申込はまだありません。</p>";
      apps.slice().reverse().forEach(function (a) {
        const div = document.createElement("div");
        div.className = "app-card";
        div.innerHTML =
          '<span class="status ' + a.status + '">' + a.status + "</span> " +
          "<strong>" + a.shopName + "</strong>（" + a.ownerName + " / " + a.email + "）<br>" +
          a.floor + " ｜ " + a.genre + " ｜ " + a.tagline + "<br>" +
          "最初の商品：" + a.product.name + " ¥" + Number(a.product.price).toLocaleString("ja-JP");
        if (a.status === "pending") {
          const ok = document.createElement("button");
          ok.className = "small-btn"; ok.textContent = "承認してお店を開く";
          ok.addEventListener("click", function () {
            fetch("/api/admin/applications/" + a.id + "/approve", { method: "POST", headers: headers() })
              .then(r => r.json())
              .then(d => { if (d.ok) { alert("お店ができました: /shop.html?slug=" + d.slug); loadAll(); } else alert(d.error); });
          });
          const ng = document.createElement("button");
          ng.className = "small-btn"; ng.textContent = "見送る";
          ng.addEventListener("click", function () {
            fetch("/api/admin/applications/" + a.id + "/reject", { method: "POST", headers: headers() })
              .then(() => loadAll());
          });
          div.appendChild(document.createElement("br"));
          div.appendChild(ok); div.appendChild(ng);
        }
        box.appendChild(div);
      });
    })
    .catch(() => { msg.className = "msg error"; msg.textContent = "管理キーが違うか、読み込みに失敗しました。"; });

  fetch("/api/shops")
    .then(r => r.json())
    .then(shops => {
      const sel = document.getElementById("shop-select");
      sel.innerHTML = "";
      shops.forEach(function (s) {
        const o = document.createElement("option");
        o.value = s.slug; o.textContent = s.name;
        sel.appendChild(o);
      });
    });
}

document.getElementById("load-btn").addEventListener("click", loadAll);

document.getElementById("product-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const slug = document.getElementById("shop-select").value;
  const msg = document.getElementById("product-msg");
  fetch("/api/admin/shops/" + slug + "/products", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({
      name: document.getElementById("p-name").value,
      price: Number(document.getElementById("p-price").value),
      description: document.getElementById("p-desc").value
    })
  })
    .then(r => r.json())
    .then(d => {
      msg.className = d.ok ? "msg ok" : "msg error";
      msg.textContent = d.ok ? "商品を追加しました。" : (d.error || "失敗しました");
      if (d.ok) this.reset();
    })
    .catch(() => { msg.className = "msg error"; msg.textContent = "接続できませんでした。"; });
});
</script>
</body>
</html>
